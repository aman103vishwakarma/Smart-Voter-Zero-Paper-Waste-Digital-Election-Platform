version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: smart_voter_postgres
    restart: always
    environment:
      POSTGRES_USER: voter_admin
      POSTGRES_PASSWORD: voter_secure_pass_2026
      POSTGRES_DB: smart_voter_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voter_admin -d smart_voter_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smart_voter_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
